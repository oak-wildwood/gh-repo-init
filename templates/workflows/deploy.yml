name: Deploy

# Publishes main to GitHub Pages via GitHub's native Actions-based deployment
# (Settings -> Pages -> source: "GitHub Actions") -- no gh-pages branch
# involved. PR previews are a separate concern -- see vercel.json / Vercel's
# GitHub integration if this repo also uses that.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub's own guidance for Pages deployments: never cancel one mid-flight,
# since that can leave the published site in a partial state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Add a project-specific verification step here (typecheck, lint) before
      # build if the repo has one -- this template doesn't assume any exist.

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
