name: Claude Nightly

# Thin caller for oak-wildwood/gh-repo-init's reusable nightly workflow —
# the behaviour lives in that repo's actions/nightly-pick and nightly-run.
# Needs the same GitHub App + CLAUDE_CODE_OAUTH_TOKEN as claude.yml, plus
# the claude-task and claude-in-progress labels — gh repo-init creates both
# when this workflow is added.

on:
  schedule:
    - cron: '0 9 * * *'  # ~2am Pacific; GitHub cron runs in UTC — adjust to your own off-hours
  workflow_dispatch:
    inputs:
      issue_number:
        description: Work this issue now instead of waiting for the cron.
        required: false

jobs:
  nightly:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: oak-wildwood/gh-repo-init/.github/workflows/nightly.yml@main
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
