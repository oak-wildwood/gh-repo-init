name: Claude Code

# Triggered by an @claude mention on an issue, a pull request, or a review
# comment. Requires the Claude GitHub App and a CLAUDE_CODE_OAUTH_TOKEN secret:
# run /install-github-app in Claude Code to set both up.
#
# On a public repo this is safe by default — the action only runs for users
# with write access to the repository, so a passer-by mentioning @claude does
# not spend your tokens. Do not set allowed_non_write_users; it removes exactly
# that protection.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # Two things worth knowing, both learned the hard way:
          #
          # 1. Without a package manager in allowedTools the agent cannot run
          #    your tests, linter or formatter — so it writes code it has no
          #    way to check, and ships failures it would have caught in one
          #    command. Swap npm for whatever this project actually uses.
          #
          # 2. By default the action pushes a branch and leaves a "Create PR"
          #    link rather than opening the pull request itself. Allowing
          #    `gh pr create` lets it finish the job when you ask it to.
          claude_args: >-
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(gh pr create:*),Bash(gh pr view:*)"
          # The agent cannot edit files under .github/workflows/ — its token
          # lacks workflow-write permission. Expect it to stop and say so
          # rather than work around it; that restriction is deliberate.
