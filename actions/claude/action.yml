name: Claude Code — @claude
description: >-
  Runs Claude for an @claude mention and posts the Run Report on the
  triggering issue or PR. The trigger text picks the model by keyword:
  "haiku" or "opus" overrides the sonnet default (see
  ../lib/resolve-model.sh). There's no fable keyword, since a comment
  trigger is already a human asking for the run live. Expects the target
  repo to be checked out already.

inputs:
  allowed_tools:
    description: --allowedTools string for the Claude Code action.
    required: true
  claude_code_oauth_token:
    description: The caller's CLAUDE_CODE_OAUTH_TOKEN secret.
    required: true

runs:
  using: composite
  steps:
    - name: Determine model from trigger text
      id: model
      shell: bash
      env:
        TRIGGER_TEXT: >-
          ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
      run: |
        text=$(printf '%s' "$TRIGGER_TEXT" | tr '[:upper:]' '[:lower:]')
        if echo "$text" | grep -qw "haiku"; then
          tier=haiku
        elif echo "$text" | grep -qw "opus"; then
          tier=opus
        else
          tier=sonnet
        fi
        echo "model=$("$GITHUB_ACTION_PATH/../lib/resolve-model.sh" "$tier")" >> "$GITHUB_OUTPUT"

    # On a public repo this is safe by default: claude-code-action only runs
    # for users with write access. Never set allowed_non_write_users here.
    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}

        additional_permissions: |
          actions: read

        claude_args: |
          --model ${{ steps.model.outputs.model }}
          --allowedTools "${{ inputs.allowed_tools }}"

    - name: Upload the Run Report artifact
      if: always() && steps.claude.outputs.execution_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: run-report-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_id }}
        path: ${{ steps.claude.outputs.execution_file }}

    - name: Post the Run Report comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        MODEL: ${{ steps.model.outputs.model }}
        CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        TARGET_KIND: >-
          ${{ (github.event_name == 'pull_request_review' ||
          github.event_name == 'pull_request_review_comment' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request))
          && 'pr' || 'issue' }}
        TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: '"$GITHUB_ACTION_PATH/../lib/post-run-report.sh"'
