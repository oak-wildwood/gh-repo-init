name: Claude Nightly — run
description: >-
  Runs Claude against the issue actions/nightly-pick claimed, posts the Run
  Report (artifact + comment, see ../lib/post-run-report.sh), and releases
  the claim whether the run succeeds or fails. A failure is simply retried
  the following night. Expects the target repo to be checked out already.

inputs:
  issue_number:
    description: The issue actions/nightly-pick claimed.
    required: true
  model:
    description: Model ID actions/nightly-pick resolved.
    required: true
  allowed_tools:
    description: --allowedTools string for the Claude Code action.
    required: true
  claude_code_oauth_token:
    description: The caller's CLAUDE_CODE_OAUTH_TOKEN secret.
    required: true

runs:
  using: composite
  steps:
    # The prompt says never to push the default branch, but a model can still get it wrong, and
    # without branch protection (a paid feature on private repos) nothing on GitHub would stop it.
    # So the checkout refuses such a push itself, and a later step fails the run if one got through.
    - name: Refuse pushes to the default branch
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        default_branch=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
        hooks="$RUNNER_TEMP/nightly-hooks"
        mkdir -p "$hooks"
        cat > "$hooks/pre-push" <<HOOK
        #!/usr/bin/env bash
        while read -r _local_ref _local_sha remote_ref _remote_sha; do
          if [ "\$remote_ref" = "refs/heads/$default_branch" ]; then
            echo "Refusing to push to $default_branch: the Nightly pushes its own branch and opens a pull request." >&2
            exit 1
          fi
        done
        HOOK
        chmod +x "$hooks/pre-push"
        git config core.hooksPath "$hooks"
        echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
        # The default branch's tip, not the checked-out HEAD: a run dispatched from another branch
        # would otherwise compare against history that is not the default branch's.
        echo "default_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" -q .sha)" >> "$GITHUB_OUTPUT"

    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}

        additional_permissions: |
          actions: read

        prompt: |
          Work autonomously on issue #${{ inputs.issue_number }}.
          Read AGENTS.md (and any other project instructions) first, and follow them.
          Never commit to or push the default branch (${{ steps.guard.outputs.default_branch }}). Before you change any file, create a branch for this work with `git checkout -b claude/issue-${{ inputs.issue_number }}`, and commit only there.
          When done, push that branch with `git push -u origin HEAD` and open a pull request with `gh pr create`, following this project's PR title convention. A pull request is the only way to deliver work: a run that changes files and ends without one has failed.
          A push to ${{ steps.guard.outputs.default_branch }} is refused on purpose. If you see that refusal, create your branch and push it instead.
          The PR body MUST include the line "Closes #${{ inputs.issue_number }}" so the issue closes when the PR merges.
          Never modify anything under .github/workflows.

        claude_args: |
          --model ${{ inputs.model }}
          --allowedTools "${{ inputs.allowed_tools }}"

    - name: Fail the job if the Claude step was skipped
      if: steps.claude.outcome == 'success'
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        CONCLUSION: ${{ steps.claude.outputs.conclusion }}
      run: |
        if [ -z "$EXECUTION_FILE" ] || [ -z "$CONCLUSION" ]; then
          echo "::error::The Claude step reported success but produced no execution_file/conclusion — it likely skipped itself (e.g. a workflow-validation mismatch between the caller's pinned ref and this repo's default branch) rather than actually running." >&2
          exit 1
        fi

    - name: Fail the job if this run's commits reached the default branch
      if: always() && steps.guard.outcome == 'success'
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ steps.guard.outputs.default_branch }}
        BEFORE: ${{ steps.guard.outputs.default_sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Looks at the commits that landed on the default branch during the run (its first-parent
        # line) and flags those made by the run's own git identity. A PR merged during the run, by
        # squash or merge commit, does not count, nor do upstream commits the agent pulled into its
        # branch; a push from a branch or a detached HEAD does. See actions/lib/default-branch-pushes.sh.
        #
        # The fetches use the job's own token, not `origin`: anthropics/claude-code-action rewrites
        # origin to carry its own short-lived app token and revokes it when it finishes, so a plain
        # `git fetch origin` here is refused ("Invalid username or token"). The token goes in the
        # URL argument, which is never written to the checkout's config.
        remote="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
        if ! git fetch -q --depth=50 "$remote" "$DEFAULT_BRANCH"; then
          echo "::warning::Could not fetch $DEFAULT_BRANCH, so the check cannot tell whether this run's commits reached it." >&2
          exit 0
        fi
        after=$(git rev-parse FETCH_HEAD)
        # The tip from before the run may be older than that shallow history: fetch it by name.
        git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch -q --depth=1 "$remote" "$BEFORE" || true
        email=$(git config user.email || true)
        if [ -z "$email" ]; then
          echo "::warning::This run has no git identity, so the check cannot tell its commits from anyone else's on $DEFAULT_BRANCH." >&2
          exit 0
        fi
        if ! pushed=$("$GITHUB_ACTION_PATH/../lib/default-branch-pushes.sh" "$BEFORE" "$after" "$email"); then
          echo "::warning::Could not check whether this run's commits reached $DEFAULT_BRANCH (see above)." >&2
          exit 0
        fi
        if [ -n "$pushed" ]; then
          echo "::error::This run's commits are on $DEFAULT_BRANCH: $(tr '\n' ' ' <<<"$pushed") The Nightly must deliver work as a pull request." >&2
          exit 1
        fi

    - name: Upload the Run Report artifact
      if: always() && steps.claude.outputs.execution_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: run-report-${{ inputs.issue_number }}-${{ github.run_id }}
        path: ${{ steps.claude.outputs.execution_file }}

    - name: Ensure PR body includes Closes directive
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
      run: |
        pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
          --json number,body,createdAt | "$GITHUB_ACTION_PATH/../lib/find-pr-for-issue.sh" "$ISSUE_NUMBER")
        if [ -n "$pr_number" ]; then
          body=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if ! printf '%s\n' "$body" | grep -q "^Closes #$ISSUE_NUMBER\$"; then
            # Prepend the Closes line
            new_body="Closes #$ISSUE_NUMBER"$'\n'"$body"
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$new_body"
          fi
        fi

    - name: Post the Run Report comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        MODEL: ${{ inputs.model }}
        CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        TARGET_KIND: issue
        TARGET_NUMBER: ${{ inputs.issue_number }}
      run: '"$GITHUB_ACTION_PATH/../lib/post-run-report.sh"'

    - name: Clear the claim on success
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
      run: |
        gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label claude-in-progress

    - name: Release the claim on failure
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        CONCLUSION: ${{ steps.claude.outputs.conclusion }}
      run: |
        gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label claude-in-progress

        if [ -z "$EXECUTION_FILE" ] || [ -z "$CONCLUSION" ]; then
          reason="the Claude step produced no output, meaning it skipped itself instead of running — check the log for a workflow-validation mismatch (the caller's pinned ref must have identical workflow content to this repo's default branch)"
        else
          reason="a usage/rate-limit message needs no action, an auth/token message means \`CLAUDE_CODE_OAUTH_TOKEN\` needs refreshing"
        fi

        gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
          --body "Nightly run failed — unclaimed for retry tomorrow. Check the [job run]($RUN_URL) log: $reason."
