name: Claude Nightly (self)

# Thin caller for oak-wildwood/gh-repo-init's reusable nightly workflow —
# the behaviour lives in that repo's actions/nightly-pick and nightly-run,
# pinned to @v1 so a fix there doesn't change this repo's Nightly until the
# tag moves. Needs the same GitHub App + CLAUDE_CODE_OAUTH_TOKEN as
# claude.yml, plus the standard label set (claude-task, claude-in-progress,
# human-task, model:haiku, model:sonnet, model:opus, model:fable) — gh
# repo-init creates all of them when this workflow is added.

on:
  schedule:
    - cron: '30 11 * * *'  # GitHub cron runs in UTC — adjust to your own off-hours
  workflow_dispatch:
    inputs:
      issue_number:
        description: Work this issue now instead of waiting for the cron.
        required: false

jobs:
  nightly:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: oak-wildwood/gh-repo-init/.github/workflows/nightly.yml@v1
    with:
      setup_node: false
      allowed_tools: "Write,Edit,Bash(bash:*),Bash(shellcheck:*),Bash(jq:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*)"
      issue_number: ${{ inputs.issue_number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
