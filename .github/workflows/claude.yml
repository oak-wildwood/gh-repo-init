name: Claude Code (reusable)

# The @claude-mention trigger behind every Tracked Repo. Callers stay ~10
# lines: see templates/workflows/claude.yml. This file is deliberately thin
# — inputs, permissions, checkout — and the behaviour lives in
# actions/claude, run from a checkout of this repo at job.workflow_sha so a
# pinned caller runs pinned behaviour (see ADR 0014 in
# oak-wildwood/cooperage).

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: >-
          --allowedTools string passed to the Claude Code action. Passing
          --allowedTools at all suppresses the action's default Write/Edit
          grant instead of adding to it — confirmed 2026-09-17, when a real
          run had no Write/Edit in its ALLOWED_TOOLS, could only
          Read/Glob/Grep, and died after 11 straight permission denials
          trying to create files — so the default here lists them
          explicitly alongside the git and gh commands needed to branch,
          commit, push and open a PR. Without a git entry Claude can edit
          files but never branch/commit/push, so `gh pr create` has
          nothing to open a PR from (confirmed 2026-09-21). The npm/npx
          entries are a placeholder — a caller whose project uses
          something else should override this input, or the agent has no
          way to check its own work before opening a PR.
        type: string
        default: >-
          Write,Edit,Bash(npm:*),Bash(npx:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(gh pr create:*),Bash(gh pr view:*)
      setup_node:
        description: Set up Node before running Claude.
        type: boolean
        default: true
      node_version:
        description: Node version to set up, when setup_node is true.
        type: string
        default: "20"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out gh-repo-init at this workflow's commit
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-repo-init
          persist-credentials: false

      - name: Keep that checkout out of Claude's commits
        run: echo /.gh-repo-init/ >> .git/info/exclude

      - name: Set up Node
        if: inputs.setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run Claude
        uses: ./.gh-repo-init/actions/claude
        with:
          allowed_tools: ${{ inputs.allowed_tools }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
