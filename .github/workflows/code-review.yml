name: Code Review (reusable)

# Runs mattpocock-skills' two-axis (Standards/Spec) code-review skill
# against a PR's diff since its base branch, and posts the report as a
# single PR comment. Callers stay ~20 lines: see
# templates/workflows/code-review.yml. Behaviour lives in
# actions/code-review, run from a checkout of this repo at
# job.workflow_sha so a pinned caller runs pinned behaviour (see ADR 0014
# in oak-wildwood/cooperage).
#
# Read-only by design: the allowed_tools default grants no Write/Edit and
# nothing pushes — this reviews, it never changes code.
#
# Triggered by workflow_dispatch (pass pr_number to pick the PR) or by
# commenting "@review" on a pull request.

on:
  workflow_call:
    inputs:
      pr_number:
        description: >-
          PR to review. Falls back to the triggering issue_comment's PR
          number when unset (the @review comment-mention path).
        type: string
        default: ""
      model:
        description: Model Tier for the review (haiku, sonnet or opus).
        type: string
        default: opus
      allowed_tools:
        description: >-
          --allowedTools string passed to the Claude Code action. No
          Write/Edit by design — this is a read-only reviewer. Includes
          the git/gh commands the skill needs to diff, look up the PR's
          base branch and spec issue, and post its report; `Read`,
          `Glob` and `Grep` so it can find and read standards/spec files
          (CODING_STANDARDS.md, CONTRIBUTING.md, docs/, specs/…) beyond
          what `cat` alone can discover; `Task`, which the
          mattpocock-skills:code-review skill requires to spawn its
          Standards and Spec sub-agents in parallel — without it the
          skill fails partway through and never posts a report; and
          `Write`, which it uses to save the report to a scratch temp
          file before `gh pr comment --body-file` (a Bash heredoc
          doesn't work here: `Bash(cat:*)`'s permission check can't
          verify a heredoc's contents and silently rejects it; a
          path-scoped `Write(/tmp/**)` isn't recognized either, so this
          grants Write unscoped). Still no push step in this workflow,
          and the prompt tells it not to touch tracked files, on a
          throwaway CI checkout either way.
        type: string
        default: >-
          Read,Glob,Grep,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*)
      setup_node:
        description: Set up Node before running Claude.
        type: boolean
        default: true
      node_version:
        description: Node version to set up, when setup_node is true.
        type: string
        default: "20"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      # workflow_dispatch needs no check here: GitHub already requires
      # write access to trigger one. The @review comment path doesn't have
      # that guarantee, so check before spending any CI time on it —
      # claude-code-action's own check (see actions/claude's note on the
      # same pattern) would reject a non-collaborator too, but only after
      # this job already paid for checkout and Node setup. This is a
      # fast-path optimization, not a replacement for that check: on
      # anything ambiguous (a bot actor, an API error) it defers rather
      # than guessing, since a false rejection here would break a
      # legitimate allowed_bots actor that only the later check recognizes.
      - name: Reject non-collaborators before spending any CI time
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" -q .permission 2>/dev/null) || {
            echo "Couldn't resolve $ACTOR's permission level (may be a bot) — deferring to claude-code-action's own check."
            exit 0
          }
          case "$permission" in
            admin|write) exit 0 ;;
            *)
              echo "::error::$ACTOR has '$permission' access, not write — refusing before checkout."
              exit 1 ;;
          esac

      - name: Resolve the PR number
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
        run: echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out gh-repo-init at this workflow's commit
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-repo-init
          persist-credentials: false

      - name: Check out the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Set up Node
        if: inputs.setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run the review
        uses: ./.gh-repo-init/actions/code-review
        with:
          pr_number: ${{ steps.pr.outputs.number }}
          model: ${{ inputs.model }}
          allowed_tools: ${{ inputs.allowed_tools }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
