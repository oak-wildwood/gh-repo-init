name: Claude Nightly (reusable)

# The Nightly behind every Tracked Repo's cron. Callers stay ~15 lines: see
# templates/workflows/claude-nightly.yml. This file is deliberately thin —
# inputs, permissions, checkout — and the behaviour lives in
# actions/nightly-pick and actions/nightly-run, where the Nightly may
# maintain it (see ADR 0014 in oak-wildwood/cooperage). Both are run from a
# checkout of this repo at job.workflow_sha, the exact commit the caller's
# ref (@v1, @main…) resolved to, so a pinned caller runs pinned behaviour.

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: >-
          --allowedTools string passed to the Claude Code action. Passing
          --allowedTools at all suppresses the action's default Write/Edit
          grant instead of adding to it, so the default here lists them
          explicitly alongside the git and gh commands needed to branch,
          commit, push, read the issue and open a PR. The npm/npx entries
          are a placeholder — a caller whose project uses something else
          should override this input.
        type: string
        default: >-
          Write,Edit,Bash(npm:*),Bash(npx:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*)
      setup_node:
        description: Set up Node before running Claude.
        type: boolean
        default: true
      node_version:
        description: Node version to set up, when setup_node is true.
        type: string
        default: "20"
      issue_number:
        description: >-
          Work this issue instead of picking the oldest open claude-task
          issue. Leave unset for the normal nightly pick.
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-nightly
  cancel-in-progress: false

jobs:
  pick-work:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue_number: ${{ steps.pick.outputs.issue_number }}
      model: ${{ steps.pick.outputs.model }}
    steps:
      - name: Check out gh-repo-init at this workflow's commit
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-repo-init
          persist-credentials: false

      - name: Pick and claim an issue
        id: pick
        uses: ./.gh-repo-init/actions/nightly-pick
        with:
          issue_number: ${{ inputs.issue_number }}

  claude:
    needs: pick-work
    if: needs.pick-work.outputs.issue_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out gh-repo-init at this workflow's commit
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gh-repo-init
          persist-credentials: false

      - name: Keep that checkout out of Claude's commits
        run: echo /.gh-repo-init/ >> .git/info/exclude

      - name: Set up Node
        if: inputs.setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run the Nightly
        uses: ./.gh-repo-init/actions/nightly-run
        with:
          issue_number: ${{ needs.pick-work.outputs.issue_number }}
          model: ${{ needs.pick-work.outputs.model }}
          allowed_tools: ${{ inputs.allowed_tools }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
